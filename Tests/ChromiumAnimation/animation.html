<script>
    // The callback always re-enqueues itself. Neither document.hidden nor a
    // hidden-page timer can stop the probe and manufacture a zero result.
    {
        const graceMs = 250;
        let frames = 0;
        let hiddenAt = document.hidden ? performance.now() : null;
        let hiddenFrames = 0;
        let lateFrames = 0;
        let period = document.hidden ? 1 : 0;

        if (location.pathname === "/target" && location.search === "?parked-navigation=1") {
            report("parked-navigation-started", {frames, period});
            link.href = "/target?background-created=1";
            link.addEventListener("click", event => report("background-link", {
                trusted: event.isTrusted, command: event.metaKey
            }));
        }
        if (location.search === "?background-created=1") {
            document.title = "Background animation fixture";
            report("background-creation-started", {frames, period});
        }

        document.addEventListener("visibilitychange", async () => {
            const now = performance.now();
            if (document.hidden) {
                hiddenAt = now;
                hiddenFrames = lateFrames = 0;
                report("animation-hidden", {frames, period: ++period});
                if (location.pathname === "/source" && period === 2) {
                    const response = await fetch("/navigate-while-hidden", {cache: "no-store"});
                    if (response.status === 204 && document.hidden) {
                        location.assign("/target?parked-navigation=1");
                    }
                }
            } else if (hiddenAt !== null) {
                report("animation-returned", {
                    frames, period, hiddenFrames, lateFrames, graceMs, durationMs: now - hiddenAt
                });
                hiddenAt = null;
            }
        });

        function frame() {
            frames++;
            if (hiddenAt !== null) {
                hiddenFrames++;
                if (performance.now() - hiddenAt >= graceMs) lateFrames++;
            }
            if (!document.hidden && frames % 12 === 0) {
                report("animation-visible", {frames, period});
            }
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    }
</script>
