<!doctype html>
<meta charset="utf-8">
<title>Bark compact window fixture</title>
<style>
    body { margin: 24px; font: 18px system-ui }
    input { padding: 8px; font: inherit }
</style>
<h1>Compact window fixture</h1>
<input id="draft" autofocus aria-label="Draft">
<script>
    const draft = document.querySelector("#draft");
    const documentID = crypto.randomUUID();
    const openerOrigin = "SOURCE_ORIGIN";
    const otherOrigin = "SECOND_ORIGIN";
    let opened = null, count = 0;

    function report(event, details = {}) {
        navigator.sendBeacon("/events", JSON.stringify({
            page: location.pathname, origin: location.origin, documentID, event,
            value: draft.value, width: innerWidth, height: innerHeight,
            activeElement: document.activeElement?.tagName, ...details
        }));
    }
    function announce() {
        const r = draft.getBoundingClientRect();
        report("ready", { point: [r.left + r.width / 2, r.top + r.height / 2],
                          hasOpener: window.opener !== null });
        if (window.opener) window.opener.postMessage({ documentID }, openerOrigin);
    }
    addEventListener("message", e => {
        if (opened && e.source === opened && [openerOrigin, otherOrigin].includes(e.origin)) {
            report("message", { sender: e.data.documentID, senderOrigin: e.origin });
        }
    });
    draft.addEventListener("input", e => report("input", { trusted: e.isTrusted }));
    document.addEventListener("keydown", e => report("key", { key: e.key, trusted: e.isTrusted }));
    draft.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        if (location.pathname === "/source") {
            count++;
            opened = window.open(count === 2 ? "/redirect" : "/popup", "_blank", "popup,width=480,height=306");
            report("opened", { count, trusted: e.isTrusted, hasHandle: opened !== null });
        } else if (window.opener) {
            report("closing", { trusted: e.isTrusted });
            window.close();
        }
    });
    addEventListener("resize", () => report("resize"));
    announce();
</script>
