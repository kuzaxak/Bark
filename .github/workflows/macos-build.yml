name: macOS Package Tests

on:
  pull_request:
  push:
    branches: [develop, pawl-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift packages on macOS 26
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The SDK tests compile real app entries from earlier bridge versions.
          fetch-depth: 0

      # The package checks run on the hosted macOS runner.
      - name: Test each package
        run: |
          for package in Packages/*/; do
            [[ -d "$package/Sources" ]] || continue
            echo "::group::$package"
            if [[ -d "$package/Tests" ]]; then
              swift test --package-path "$package"
            else
              swift build --package-path "$package"
            fi
            echo "::endgroup::"
          done

      - name: Check the CloudKit schema tooling offline
        run: bash scripts/tests/check-production-schema-check.sh

      - name: Check native command routing
        run: python3 scripts/bark-check.py interaction

      - name: Check both directions of MCP connections
        run: |
          python3 -B Tests/DevMCP/check.py
          python3 -B Tests/DevMCP/check_client.py

      - name: Check the app bootstrap and SDK tools
        run: |
          python3 -B -m unittest discover -s scripts/tests
          python3 -B -m unittest discover -s Runtime/Chromium -p 'test_*.py'
          python3 -B -m unittest discover -s Tests/Shared
          python3 -B -m unittest discover -s Tests/ChromiumSDKLauncher
          python3 -B Tests/ChromiumSDKLauncher/check_helper_roles.py
          python3 -B -m unittest discover -s Tests/ChromiumStartup
          python3 -B -m unittest discover -s Tests/ChromiumUpdate
          python3 -B Tests/ChromiumAppShim/check.py

  native-interaction:
    name: Bark window and page routing
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Make Metal available
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Check page ownership, profile controls and deletion, Site Controls, blocking and page tweaks
        run: |
          test ! -e build
          python3 -B scripts/bark-check.py catalog
          python3 -B scripts/bark-check.py page-host
          python3 -B scripts/bark-check.py profile-pages
          python3 -B scripts/bark-check.py profile-deletion
          python3 -B scripts/bark-check.py blocker
          python3 -B scripts/bark-check.py page-tweaks
          python3 -B Tests/ChromiumSiteControls/check.py
          python3 -B Tests/ChromiumStartup/check.py
          test ! -e build

      - name: Check profile history import and page-text migration
        run: |
          python3 -B Tests/ChromiumImport/check.py
          swiftc Packages/NookWeb/Sources/NookWeb/HistoryTextIndex.swift \
            Packages/NookWeb/Checks/HistoryTextIndexCheck.swift -o "$RUNNER_TEMP/history-text-check"
          "$RUNNER_TEMP/history-text-check"

  release-shell:
    name: Bark Release shell (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/Runtime/
            !/Tests/

      - name: Make Metal available
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Build and inspect the unsigned Release shell
        env:
          BARK_SHELL_ARCH: ${{ matrix.arch }}
        run: |
          test ! -e Runtime && test ! -e Tests && test ! -e build
          python3 -B scripts/bark-check.py shell --arch "$BARK_SHELL_ARCH"
          test ! -e build

  signed-smoke:
    name: Smoke-test the pinned signed Bark candidate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.BARK_SMOKE_RUNNER != '' &&
      vars.BARK_ENGINE_SOURCE != '' &&
      (vars.BARK_SIGN_IDENTITY != '' || vars.BARK_SMOKE_CANDIDATE != '')
    runs-on: [self-hosted, macOS, "${{ vars.BARK_SMOKE_RUNNER }}"]
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned SDK for this runner
        env:
          BARK_ENGINE_SOURCE: ${{ vars.BARK_ENGINE_SOURCE }}
        run: |
          set -euo pipefail
          arch="$(python3 scripts/chromium_sdk_layout.py native-arch)"
          pin="$(python3 scripts/chromium_sdk_layout.py digest Packages/BarkEngine "$arch")"
          python3 scripts/bark-check.py engine --arch "$arch" --engine "$BARK_ENGINE_SOURCE" --install
          printf 'BARK_SMOKE_ARCH=%s\nBARK_SMOKE_PIN=%s\nBARK_SMOKE_WORK=\n' "$arch" "$pin" >> "$GITHUB_ENV"

      - name: Build Bark from an empty output directory
        if: vars.BARK_SIGN_IDENTITY != ''
        env:
          BARK_SIGN_IDENTITY: ${{ vars.BARK_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test ! -e build
          work="$(mktemp -d "$RUNNER_TEMP/bark-smoke.XXXXXXXX")"
          printf 'BARK_SMOKE_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          env -u BARK_ENGINE_SOURCE python3 scripts/bark-check.py build --arch "$BARK_SMOKE_ARCH" \
            --output "$work/Bark.app"
          test ! -e build

      - name: Check catalog and initial window activation
        run: python3 scripts/bark-check.py catalog

      - name: Verify and launch the signed candidate
        env:
          BARK_SMOKE_CANDIDATE: ${{ vars.BARK_SMOKE_CANDIDATE }}
        run: |
          set -euo pipefail
          if [[ -n "${BARK_SMOKE_WORK:-}" ]]; then
            app="$BARK_SMOKE_WORK/Bark.app"
          else
            app="$BARK_SMOKE_CANDIDATE"
          fi
          shell_source="$(python3 -B scripts/bark-check.py shell-source)"
          env -u BARK_ENGINE_SOURCE python3 scripts/bark-check.py smoke --arch "$BARK_SMOKE_ARCH" \
            --shell-source "$shell_source" "$app"
          python3 -B Tests/ChromiumSDKLauncher/check_helper_roles.py --app "$app"
          {
            echo '### Signed Bark smoke'
            printf 'Architecture: `%s`\n\nSDK pin: `%s`\n\nShell inputs at `%s`: `%s`\n' \
              "$BARK_SMOKE_ARCH" "$BARK_SMOKE_PIN" "$GITHUB_SHA" "$shell_source"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove this run's temporary candidate
        if: always() && env.BARK_SMOKE_WORK != ''
        run: rm -rf -- "$BARK_SMOKE_WORK"
