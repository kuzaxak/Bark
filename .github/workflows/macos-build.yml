name: macOS Package Tests

on:
  pull_request:
  push:
    branches: [develop, pawl-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift packages on macOS 26
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The app needs the published Chromium engine, which CI does not have.
      - name: Test each package
        run: |
          for package in Packages/*/; do
            [[ -d "$package/Sources" ]] || continue
            echo "::group::$package"
            if [[ -d "$package/Tests" ]]; then
              swift test --package-path "$package"
            else
              swift build --package-path "$package"
            fi
            echo "::endgroup::"
          done
